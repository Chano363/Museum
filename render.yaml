services:
  - type: web
    name: museum-exhibition-backend
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python backend/app.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: "10000"
    healthCheckPath: /api/health
